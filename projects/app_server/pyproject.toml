[project]
name = "app-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.2",
    "fastapi[standard]>=0.140.13",
    "pyjwt>=2.13.0",
    "sqlalchemy>=2.0.51",
    "storelib",
]

[tool.uv.sources]
storelib = { workspace = true }
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app_server"]
