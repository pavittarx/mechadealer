[project]
name = "orders-management"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "brokerlib",
    "coreutils",
    "datastore",
    "kafkalib>=0.2.8",
    "python-dotenv>=1.2.2",
    "storelib",
]

[tool.uv.sources]
datastore = { workspace = true }
storelib = { workspace = true }
coreutils = { workspace = true }
brokerlib = { workspace = true }

[project.scripts]
orders-management = "orders_management.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orders_management"]
