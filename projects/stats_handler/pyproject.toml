[project]
name = "stats-handler"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.2",
    "brokerlib",
    "coreutils",
    "storelib",
]

[tool.uv.sources]
coreutils = { workspace = true }
storelib = { workspace = true }
brokerlib = { workspace = true }

[project.scripts]
stats-handler = "stats_handler.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stats_handler"]
