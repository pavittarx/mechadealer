[project]
dependencies = [
  "asyncpg>=0.31.0",
  "coreutils",
  "datastore",
  "kafkalib>=0.1.1",
  "pandas>=3.0.5",
  "psycopg>=3.3.4",
  "psycopg-binary>=3.3.4",
  "psycopg-pool>=3.3.1",
  "python-dotenv>=1.2.2",
  "pytz>=2026.3.post1",
  "questdb[dataframe]>=5.0.0",
  "quixstreams>=3.25.0",
  "requests>=2.34.2",
]
description = "Add your description here"
name = "datasync"
readme = "README.md"
requires-python = ">=3.12"
version = "0.1.0"

[tool.uv.sources]
datastore = { workspace = true }
coreutils = { workspace = true }

[project.scripts]
datasync = "datasync.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datasync"]
