[project]
name = "strategy-0"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.2",
    "pandas>=3.0.5",
    "pandas-ta-classic>=0.6.52",
    "strategylib",
]

[tool.uv.sources]
strategylib = { workspace = true }

[project.scripts]
strategy-0 = "strategy_0.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strategy_0"]
