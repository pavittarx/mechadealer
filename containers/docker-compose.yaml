# Prefer the task runner, which passes the right flags:
#   uv run poe up          # infrastructure only
#   uv run poe down
#
# Raw equivalents. --env-file is required: compose resolves ${VAR} against a
# .env next to this file, not against the repository root.
#   docker compose --env-file .env -f containers/docker-compose.yaml up -d
#   docker compose --env-file .env -f containers/docker-compose.yaml --profile services up -d
#
# Named volumes are used throughout. The previous ${PWD}/.questdb bind mount
# resolved against whatever directory compose happened to be invoked from.

name: mechadealer

x-service-base: &service-base
  build:
    context: ..
    dockerfile: containers/Dockerfile
  env_file:
    - ../.env
  environment:
    KAFKA_BROKER_ADDRESS: kafka:29092
    PG_CONNECTION_STRING: postgresql://test:1235789@postgres:5432/pgdb
    QDB_CONNECTION_STRING: postgresql://admin:quest@questdb:8812/qdb
    QDB_CLIENT_CONF: http::addr=questdb:9000;
    MECHADEALER_HOME: /var/lib/mechadealer
  volumes:
    - service_state:/var/lib/mechadealer
  restart: unless-stopped
  profiles: [services]

services:
  questdb:
    image: questdb/questdb:latest
    container_name: questdb
    ports:
      - "${QDB_HTTP_PORT:-9000}:9000" # Web Console (UI), REST API
      - "${QDB_ILP_PORT:-9009}:9009" # InfluxDB Line Protocol (ILP)
      - "${QDB_PG_PORT:-8812}:8812" # PGWire
      - "${QDB_HEALTH_PORT:-9003}:9003" # Min Health Server
    volumes:
      - questdb_data:/var/lib/questdb
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9003/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16
    container_name: postgres
    ports:
      - "${PG_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: 1235789
      POSTGRES_DB: pgdb
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d pgdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.0.0
    hostname: broker
    container_name: kafka
    # `hostname:` alone is not resolvable by other containers -- only the
    # service name is. KAFKA_ADVERTISED_LISTENERS hands clients "broker:29092",
    # so that name needs a real network alias or every client fails to connect.
    networks:
      default:
        aliases: [broker]
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092,CONTROLLER://broker:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    # No named volume here on purpose: it would be created root-owned and the
    # image runs as uid 1000, so KRaft cannot format /tmp/kraft-combined-logs.
    healthcheck:
      test:
        ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: kafdrop
    restart: unless-stopped
    ports:
      - "${KAFDROP_PORT:-9001}:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:29092
      JVM_OPTS: "-Xms32M -Xmx64M"
      SERVER_SERVLET_CONTEXTPATH: "/"
    depends_on:
      kafka:
        condition: service_healthy

  # --- application services (profile: services) ---------------------------

  app_server:
    <<: *service-base
    container_name: app_server
    command: uvicorn app_server.main:app --host 0.0.0.0 --port 8000
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  datasync:
    <<: *service-base
    container_name: datasync
    command: datasync
    depends_on:
      questdb:
        condition: service_healthy
      kafka:
        condition: service_healthy

  orders_management:
    <<: *service-base
    container_name: orders_management
    command: orders-management
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  stats_handler:
    <<: *service-base
    container_name: stats_handler
    command: stats-handler
    depends_on:
      postgres:
        condition: service_healthy

  strategy_0:
    <<: *service-base
    container_name: strategy_0
    command: strategy-0
    depends_on:
      questdb:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  pg_data:
  questdb_data:
  service_state:
